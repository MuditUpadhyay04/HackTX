  <ellipse cx="98" cy="128" rx="7" ry="4" fill="#D98973" opacity="0.45"/>
  <ellipse cx="142" cy="128" rx="7" ry="4" fill="#D98973" opacity="0.45"/>
  <circle cx="120" cy="100" r="2.6" fill="#B3263A"/>
