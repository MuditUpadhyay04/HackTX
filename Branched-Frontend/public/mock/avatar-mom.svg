    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BF8662"/><stop offset="1" stop-color="#A9714F"/></linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <circle cx="186" cy="54" r="34" fill="#FBE7D6" opacity="0.6"/>
